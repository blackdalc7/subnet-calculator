# CI for subnet-calculator. Runs when this folder is pushed as its own repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUFF_VERSION: "0.17.2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: py ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt "ruff==${RUFF_VERSION}"
      - name: Lint
        run: ruff check .
      - name: Unit tests with coverage gate
        run: pytest --cov --cov-report=term-missing
